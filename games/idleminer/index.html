<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>Idle Miner Tycoon</title>

    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="HandheldFriendly" content="true">
    <meta name="mobile-web-app-capable" content="yes">

    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }

        html, body {
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            width: 100%;
            height: 100%;
        }

        canvas {
            touch-action-delay: none;
            touch-action: none;
            -ms-touch-action: none;
        }

        /* Center the game in the viewport and scale it up/down as large as
           possible while keeping its native 317:563 aspect ratio (no stretch) */
        #c2canvasdiv {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #c2canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            aspect-ratio: 317 / 563;
        }
    </style>
</head>

<body>

    <!-- Issue a warning if trying to preview an exported project on disk. -->
    <script>
        (function() {
            if (window.location.protocol.substr(0, 4) === "file") {
                alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");
            }
        })();
    </script>

    <!-- The canvas must be inside a div called c2canvasdiv -->
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="317" height="563">
            <h1>Your browser does not appear to support HTML5. Try upgrading your browser to the latest version.
                <a href="http://www.whatbrowser.org">What is a browser?</a>
                <br><br>
                <a href="http://www.microsoft.com/windows/internet-explorer/default.aspx">Microsoft Internet Explorer</a><br>
                <a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br>
                <a href="http://www.google.com/chrome/">Google Chrome</a><br>
                <a href="http://www.apple.com/safari/download/">Apple Safari</a>
            </h1>
        </canvas>
    </div>

    <!-- Construct 2 exported games require jQuery. -->
    <script src="https://485925-736174.preview.editmysite.com/uploads/b/139890129-640425360949992905/files/jquery-2.1.1.min.js"></script>

    <!-- The Construct 2 runtime -->
    <script src="https://485925-736174.preview.editmysite.com/uploads/b/139890129-640425360949992905/files/c2runtime.js"></script>

    <script>
        // Start the Construct 2 project running on window load.
        jQuery(document).ready(function() {
            cr_createRuntime("c2canvas");
        });

        // Pause and resume on page becoming visible/invisible
        function onVisibilityChanged() {
            if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
                cr_setSuspended(true);
            else
                cr_setSuspended(false);
        }

        document.addEventListener("visibilitychange", onVisibilityChanged, false);
        document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
        document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
    </script>

</body>
</html>
